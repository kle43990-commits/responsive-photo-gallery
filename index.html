<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>
            A collection of beautiful places, nature, and memorable moments.
        </p>
    </header>

    <main>

        <figure>
            <img src="images/photo1.jpg" alt="A tall mountain covered with green trees under a clear blue sky">
            <figcaption>Mountain Landscape</figcaption>
        </figure>

        <figure>
            <img src="images/photo2.jpg" alt="Blue ocean water meeting a sandy beach under bright sunlight">
            <figcaption>Beautiful Beach</figcaption>
        </figure>

        <figure>
            <img src="images/photo3.jpg" alt="Dense green trees covering a peaceful forest area">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="images/photo4.jpg" alt="Tall buildings forming a modern city skyline">
            <figcaption>City Skyline</figcaption>
        </figure>

        <figure>
            <img src="images/photo5.jpg" alt="Orange sunlight reflecting across the ocean during sunset">
            <figcaption>Ocean Sunset</figcaption>
        </figure>

        <figure>
            <img src="images/photo6.jpg" alt="A snow covered mountain surrounded by a winter landscape">
            <figcaption>Snowy Mountain</figcaption>
        </figure>

        <figure>
            <img src="images/photo7.jpg" alt="Water flowing down a rocky waterfall surrounded by vegetation">
            <figcaption>Waterfall</figcaption>
        </figure>

        <figure>
            <img src="images/photo8.jpg" alt="Colorful flowers growing together in a green garden">
            <figcaption>Flower Garden</figcaption>
        </figure>

        <figure>
            <img src="images/photo9.jpg" alt="A calm blue lake surrounded by tall mountains">
            <figcaption>Mountain Lake</figcaption>
        </figure>

    </main>

    <footer>
        <p>Created for the Responsive Design Final Project.</p>
    </footer>

</body>

</html>
